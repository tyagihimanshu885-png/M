<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Trump Premium - FINAL ULTRA NoSetup - JIO FIX</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',system-ui}
body{background:#0e5a2f;min-height:100vh;overflow:hidden;user-select:none}
.felt{position:fixed;inset:0;background:#0e5a2f;display:flex;align-items:center;justify-content:center}
.table{width:100vw;height:100vh;max-width:520px;position:relative;background:radial-gradient(ellipse at center,#1a7a44 0%,#0e5a2f 70%);overflow:hidden}
.player{position:absolute;display:flex;flex-direction:column;align-items:center;gap:5px;z-index:5}
.p-top{top:10px;left:50%;transform:translateX(-50%)}
.p-left{left:6px;top:36%;transform:translateY(-50%)}
.p-right{right:6px;top:36%;transform:translateY(-50%)}
.p-bottom{bottom:0;left:50%;transform:translateX(-50%);width:100%;z-index:20}
.avatar{width:42px;height:42px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#000;border:3px solid #ffca28;box-shadow:0 2px 6px rgba(0,0,0,.4);font-size:15px}
.avatar.active{border-color:#00e676;box-shadow:0 0 12px #00e676;background:#e8f5e9}
.avatar.offline{border-color:#ff5252;opacity:0.6}
.nameTag{background:rgba(0,0,0,.85);color:#fff;padding:2px 7px;border-radius:8px;font-size:11px;text-align:center;line-height:1.1;min-width:42px}
.nameTag b{color:#ffca28;font-size:12px}
.cards{display:flex;justify-content:center}
.card{width:46px;height:66px;background:#fff;border-radius:6px;border:1px solid #777;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:2px;font-weight:800;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.4);transition:transform .12s;margin-left:-6px;position:relative;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.card:first-child{margin-left:0}
.card.red{color:#d32f2f}.card.black{color:#111}
.card.back{background:repeating-linear-gradient(45deg,#1a3a5a,#1a3a5a 4px,#2a5a8a 4px,#2a5a8a 8px);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.card.disabled{opacity:0.25;pointer-events:none;filter:grayscale(1)}
.p-top .cards{margin-top:6px}.p-top .card{width:28px;height:38px;margin-left:-14px;border-width:1px;border-radius:3px}
.p-left .cards,.p-right .cards{flex-direction:column;margin-top:6px}.p-left .card,.p-right .card{width:38px;height:28px;margin-left:0;margin-top:-18px;transform:none;border-radius:3px}
.p-left .card:first-child,.p-right .card:first-child{margin-top:0}
.p-bottom .cards{width:98vw;max-width:520px;padding:0 4px;gap:0;justify-content:center}
.p-bottom .card{width:8.2vw;max-width:46px;min-width:32px;height:72px;margin-left:-3px;border-radius:6px 6px 0 0;transition:transform .12s ease;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:2px 1px}
.p-bottom .card .rank{font-size:11px;line-height:1}
.p-bottom .card .suit{font-size:26px;line-height:1;margin:2px 0}
.p-bottom .card:active{transform:translateY(-10px) scale(1.05);z-index:30}
.centerWrap{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:320px;height:320px;z-index:6;display:flex;align-items:center;justify-content:center}
.trumpCenter{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:120px;opacity:0.28;color:#fff;font-weight:900;pointer-events:none;z-index:1;text-shadow:0 0 30px #000,0 0 50px #000}
.trumpCenter.red{color:#ff8a8a;opacity:0.40}
.trumpBadge{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:#ffca28;color:#000;padding:3px 10px;border-radius:12px;font-weight:800;font-size:12px;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.5);white-space:nowrap}
.centerCards{position:relative;width:100%;height:100%;display:block;z-index:2}
.centerCards .card{position:absolute;width:70px;height:94px;margin:0;box-shadow:0 6px 18px rgba(0,0,0,.6);border-radius:8px;border:2px solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.centerCards .card .whoLabel{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.9);color:#ffca28;font-size:9px;padding:1px 6px;border-radius:10px;white-space:nowrap;font-weight:700;border:1px solid #ffca28}
.centerCards .card.pos-A{bottom:15px;left:50%;z-index:4;transform:translate(-50%,0)}
.centerCards .card.pos-B{left:10px;top:50%;z-index:3;transform:translate(0,-50%)}
.centerCards .card.pos-C{top:15px;left:50%;z-index:2;transform:translate(-50%,0)}
.centerCards .card.pos-D{right:10px;top:50%;z-index:3;transform:translate(0,-50%)}
.turnBar{position:absolute;left:2%;right:2%;top:62%;background:#ff9800;color:#000;padding:6px 10px;border-radius:4px;font-weight:700;font-size:12px;z-index:15;text-align:left}
.scoreBoard{position:absolute;right:6px;bottom:80px;background:rgba(255,255,255,.96);border:1px solid #000;border-radius:4px;padding:3px;font-size:9px;z-index:25;min-width:132px}
.scoreBoard table{width:100%;border-collapse:collapse}.scoreBoard td,.scoreBoard th{border:1px solid #555;padding:2px 4px;text-align:center}.scoreBoard th{background:#ddd;font-size:8px}
.ui{position:fixed;left:4px;top:4px;background:rgba(0,0,0,.85);color:#fff;padding:6px 8px;border-radius:8px;font-size:9px;min-width:190px;z-index:100;transition:all .4s}
.ui.hideGame{opacity:0;pointer-events:none;transform:translateY(-30px)}
.btn{padding:8px 14px;border-radius:7px;border:none;font-weight:700;cursor:pointer;margin:2px;font-size:13px}.by{background:#ffca28;color:#000}.bg{background:#2e7d32;color:#fff}.bb{background:#1565c0;color:#fff}.br{background:#c62828;color:#fff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:300}.modalBox{background:#123e33;border-radius:12px;padding:14px;max-width:520px;width:94%;border:2px solid #1f6b55;text-align:center;max-height:92vh;overflow:auto}
.hidden{display:none}
</style>
</head>
<body>
<div class="felt"><div class="table">
<div class="player p-top" id="seat-C"><div class="avatar" id="av-C">C</div><div class="nameTag" id="tag-C">C<br><b>0/4</b></div><div class="cards" id="hand-C"></div></div>
<div class="player p-left" id="seat-B"><div class="avatar" id="av-B">B</div><div class="nameTag" id="tag-B">B<br><b>0/3</b></div><div class="cards" id="hand-B"></div></div>
<div class="player p-right" id="seat-D"><div class="avatar" id="av-D">D</div><div class="nameTag" id="tag-D">D<br><b>0/2</b></div><div class="cards" id="hand-D"></div></div>
<div class="centerWrap"><div id="trumpBadge" class="trumpBadge">TRUMP: ?</div><div id="trumpCenter" class="trumpCenter"></div><div id="timerBar">⏱ 30s</div><div id="centerCards" class="centerCards"></div></div>
<div id="turnBar" class="turnBar hidden">Your turn!</div>

<div class="scoreBoard"><table><tr><th>Player</th><th>Score</th><th>Bagh</th></tr><tr><td id="p0">A</td><td id="sc0">0</td><td id="bg0">0</td></tr><tr><td id="p1">B</td><td id="sc1">0</td><td id="bg1">0</td></tr><tr><td id="p2">C</td><td id="sc2">0</td><td id="bg2">0</td></tr><tr><td id="p3">D</td><td id="sc3">0</td><td id="bg3">0</td></tr></table></div>
<div class="cards" id="hand-A"></div></div>
</div></div>
